name: tvpoll

x-postgres: &postgres
  image: postgres:17.11-alpine
  restart: unless-stopped
  environment:
    POSTGRES_USER: tvpoll
    POSTGRES_PASSWORD: local-only-database-password
    POSTGRES_DB: tvpoll
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U tvpoll -d tvpoll"]
    interval: 2s
    timeout: 3s
    retries: 30
    start_period: 5s

services:
  control:
    <<: *postgres
    ports: ["127.0.0.1:15432:5432"]
    volumes: ["control-data:/var/lib/postgresql/data"]
  shard-0:
    <<: *postgres
    ports: ["127.0.0.1:15433:5432"]
    volumes: ["shard-0-data:/var/lib/postgresql/data"]
  shard-1:
    <<: *postgres
    ports: ["127.0.0.1:15434:5432"]
    volumes: ["shard-1-data:/var/lib/postgresql/data"]
  server:
    build: .
    init: true
    restart: unless-stopped
    ports: ["127.0.0.1:8080:8080"]
    environment:
      CONTROL_DATABASE_URL: postgres://tvpoll:local-only-database-password@control:5432/tvpoll?sslmode=disable
      SHARD_DATABASE_URLS: postgres://tvpoll:local-only-database-password@shard-0:5432/tvpoll?sslmode=disable,postgres://tvpoll:local-only-database-password@shard-1:5432/tvpoll?sslmode=disable
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Copy .env.example to .env first}
      COOKIE_SECRET: ${COOKIE_SECRET:?Copy .env.example to .env first}
      DEDUP_SECRET: ${DEDUP_SECRET:?Copy .env.example to .env first}
      COOKIE_SECURE: "false"
      PUBLIC_ORIGIN: http://localhost:8080
      BATCH_SIZE: "256"
      BATCH_WAIT_MS: "5"
      WORKERS_PER_SHARD: "4"
      QUEUE_SIZE: "4096"
      MAX_DB_CONNS: "8"
    depends_on:
      control: {condition: service_healthy}
      shard-0: {condition: service_healthy}
      shard-1: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    stop_grace_period: 45s

volumes:
  control-data:
  shard-0-data:
  shard-1-data:
